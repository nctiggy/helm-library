{{- if .Values.credentials.enabled }}
# k8s-04: the Secrets cluster/scripts/restore-secrets.sh used to push up from /home.
#
# One template over a map rather than seven near-identical files, the same shape
# templates/timers.yaml uses, so adding a credential is a values entry and nothing else.
#
# These carry an explicit `namespace`, which almost nothing else in this chart does. Four of
# the seven live outside the release namespace -- factory, backyard-concrete, arc-runners --
# because the workload that reads them does. Putting them in the chart rather than in
# cluster/40-apps keeps them in one release that `helm get manifest` can account for, which is
# the whole point of k8s-02: a hand-applied resource is one nothing tracks.
{{- range $key, $c := .Values.credentials.items }}
{{- if $c.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $c.secretName }}
  namespace: {{ $c.namespace }}
  labels:
    {{- include "lawnmower.labels" $ | nindent 4 }}
    app.kubernetes.io/component: credentials-{{ $key }}
spec:
  refreshInterval: {{ $.Values.credentials.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.credentials.storeName }}
  target:
    name: {{ $c.secretName }}
    # Owner, so a `helm uninstall` takes the Secret with it rather than orphaning a
    # credential nothing is managing any more.
    creationPolicy: Owner
  data:
    # secretKey is the KUBERNETES key and remoteRef is the 1PASSWORD field; they differ where
    # a key contains a dot, because a dot in an `op item create` assignment is a section
    # separator (values.yaml says what that cost). `key` is "<itemId>/<field>" -- op:// and
    # item+property are both rejected by this provider.
    {{- range $k8sKey, $opField := $c.fields }}
    - secretKey: {{ $k8sKey | quote }}
      remoteRef:
        key: {{ $c.itemTitle | quote }}
        property: {{ $opField | quote }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
