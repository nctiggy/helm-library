{{- if .Values.appCreds.enabled }}
# The GitHub App credential, synced from 1Password by ESO rather than carried into the pod.
#
# loop/ralph-app-token.sh reads 1Password directly on the VM. A pod has no `op` and no
# service-account token, and giving it one would hand every timer pod read access to the whole
# Lobster vault to fetch three fields. So ESO syncs exactly those three, and the script's
# RALPH_APP_CREDS_DIR path reads them as mounted files.
#
# The store is the one that already exists and is already Valid/Ready: ClusterSecretStore
# onepassword-lobster, which cert-manager's cloudflare-api-token has used since 9/13/26.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.appCreds.secretName }}
  labels:
    {{- include "lawnmower.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.appCreds.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.appCreds.storeName }}
  target:
    name: {{ .Values.appCreds.secretName }}
    creationPolicy: Owner
  # One key per field, named exactly as the script expects its files to be named, so the
  # mount needs no renaming layer and a typo fails at sync rather than at 03:00.
  #
  # `key` is "<itemId>/<field>", copied from cert-manager's cloudflare-api-token, which is the
  # one ExternalSecret already syncing against this store. Two wrong guesses first, both
  # measured 9/18/26 and both worth writing down because the error messages point elsewhere:
  #   item name + `property: <field>`  ->  "secret reference has invalid format - must be
  #                                        op://<vault>/<item>/[section/]field"
  #   op://Lobster/<itemId>/<field>    ->  "invalid character in secret reference: secret
  #                                        references must only contain alphanumeric, _, .
  #                                        or - characters"
  # The first message names a form the parser then rejects. The vault comes from the store,
  # not the reference.
  #
  # Addressed by ID rather than title: a title can be renamed in 1Password and silently break
  # the sync; an ID cannot.
  data:
    {{- range $field := list "github_app_id" "github_app_installation_id" "github_app_private_key" }}
    - secretKey: {{ $field }}
      remoteRef:
        key: {{ $.Values.appCreds.itemTitle | quote }}
        property: {{ $field | quote }}
    {{- end }}
{{- end }}
---
{{- if .Values.cloneToken.enabled }}
# The clone credential. See values.yaml for why this is a different credential from the one
# ralph-token-refresh writes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.cloneToken.secretName }}
  labels:
    {{- include "lawnmower.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.cloneToken.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.appCreds.storeName }}
  target:
    name: {{ .Values.cloneToken.secretName }}
    creationPolicy: Owner
  data:
    # Key named `token`, because that is the filename the clone step reads.
    - secretKey: token
      remoteRef:
        key: {{ .Values.cloneToken.itemTitle | quote }}
        property: {{ .Values.cloneToken.field | quote }}
{{- end }}
---
{{- if .Values.crswdAccess.enabled }}
# The Cloudflare Access service token for crswd (k8s-05). Two fields, synced from the same
# 1Password item the VM's crswd-api reads, through the same ClusterSecretStore the other two
# ExternalSecrets here already use.
#
# Mounted as files rather than a secretKeyRef env for the reason appCreds gives above: an env
# var is a snapshot frozen at pod creation, a file is re-read at use time, so an ESO refresh
# reaches a pod that is already running.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.crswdAccess.secretName }}
  labels:
    {{- include "lawnmower.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.crswdAccess.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.appCreds.storeName }}
  target:
    name: {{ .Values.crswdAccess.secretName }}
    creationPolicy: Owner
  data:
    # Key names are the FILENAMES loop/crswd-reach.sh opens, so the mount needs no renaming
    # layer and a typo fails at sync rather than at the first pod that needs it.
    {{- range $field := list "access-client-id" "access-client-secret" }}
    - secretKey: {{ $field }}
      remoteRef:
        key: {{ $.Values.crswdAccess.itemTitle | quote }}
        property: {{ $field | quote }}
    {{- end }}
{{- end }}
